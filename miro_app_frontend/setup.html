<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>Miro App Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/vendor/mirotone.css">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <header class="panel-head">
          <span class="eyebrow">Developer Console</span>
          <h1>Miro App Setup</h1>
          <p class="lead">Diese Seite fasst die URLs und Assets zusammen, die du in der Miro Developer Console brauchst.</p>
        </header>
        <div class="panel-body">
          <div class="surface">
            <dl class="grid" id="setup-grid"></dl>
          </div>
          <section class="icon-section">
            <h2>Icons</h2>
            <p class="lead">Lade diese SVGs in der Miro Developer Console als Kontur- und Farbsymbol hoch.</p>
            <div class="icon-grid" id="icon-grid"></div>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="/setup.js"></script>
  </body>
</html>
