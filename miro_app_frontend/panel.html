<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>OpenProject Miro App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/vendor/mirotone.css">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="panel panel-compact">
        <div class="panel-body">
          <section class="stack stack-tight">
            <div class="label">Einzelne Karte</div>
            <div class="miro-actions">
              <button class="button button-primary button-small" id="create-disconnected" type="button">
                <span class="icon icon-plus" aria-hidden="true"></span>
                Neue Card fuer User Story anlegen
              </button>
              <button class="button button-secondary button-small" id="refresh-all-cards" type="button">
                <span class="icon icon-refresh" aria-hidden="true"></span>
                Alle Cards aus OpenProject aktualisieren
              </button>
            </div>
          </section>

          <section class="stack stack-tight">
            <div class="label">Version importieren</div>
            <div class="inline-field">
              <select id="version-select" aria-label="Letzte 5 OpenProject-Versionen"></select>
              <button
                class="button-icon button-icon-small icon-refresh"
                id="reload-versions"
                type="button"
                aria-label="Versionen neu laden"
                title="Versionen neu laden"
              ></button>
            </div>
            <div class="miro-actions">
              <button class="button button-primary button-small" id="create-version-board" type="button">
                <span class="icon icon-board" aria-hidden="true"></span>
                Frame und Cards fuer Version anlegen
              </button>
            </div>
          </section>
          <div class="status-box" id="status"></div>
          <div class="miro-actions" id="status-actions" hidden>
            <button class="button button-secondary button-small" id="auth-button" type="button">
              Miro verbinden
            </button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
